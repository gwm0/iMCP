name: Home helper

on:
  push:
    branches: [homelab-home-helper]
    paths: [Helper/**, Shared/**, iMCP.xcodeproj/**, .github/workflows/home-helper.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build Intel Mac Catalyst helper
        run: |
          xcodebuild -quiet -project iMCP.xcodeproj -scheme 'iMCP Helper' \
            -configuration Release -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath build ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO \
            HELPER_BUNDLE_IDENTIFIER=xyz.homelab.imcp.helper \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned helper
        run: |
          app='build/Build/Products/Release-maccatalyst/iMCP Helper.app'
          lipo -verify_arch x86_64 "$app/Contents/MacOS/iMCP Helper"
          mkdir -p dist
          ditto -c -k --keepParent "$app" dist/imcp-home-helper-intel-unsigned.zip
          shasum -a 256 dist/*.zip > dist/SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > dist/SOURCE_COMMIT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: imcp-home-helper-intel-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 14
